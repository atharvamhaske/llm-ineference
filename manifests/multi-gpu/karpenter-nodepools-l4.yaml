# Karpenter NodePools — L4-class GPUs, prefill (spot) + decode (on-demand)
# Blog-equivalent, scaled for small team. Requires EKS + Karpenter + EC2NodeClass "gpu".
# See docs/multi-gpu-karpenter-stack.md
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: prefill
spec:
  template:
    metadata:
      labels:
        llm-d.ai/role: prefill
        nvidia.com/gpu.present: "true"
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6.xlarge", "g6.2xlarge", "g5.xlarge", "g5.2xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: llm-d.ai/role
          value: prefill
          effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits:
    cpu: 64
    memory: 256Gi
    nvidia.com/gpu: 4
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: decode
spec:
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
        nvidia.com/gpu.present: "true"
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6.xlarge", "g6.2xlarge", "g5.xlarge", "g5.2xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: llm-d.ai/role
          value: decode
          effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits:
    cpu: 64
    memory: 256Gi
    nvidia.com/gpu: 4
